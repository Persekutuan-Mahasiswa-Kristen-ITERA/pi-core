packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts by default. esbuild and workerd need
# theirs to run so the OpenNext/Cloudflare toolchain works (story 1.2).
onlyBuiltDependencies:
  - esbuild
  - workerd

# Force a patched glob (GHSA-5j98-mcp5-4vw2) reached transitively via
# @opennextjs/cloudflare -> @opennextjs/aws -> @node-minify/core.
overrides:
  "glob@>=10.2.0 <10.5.0": ">=10.5.0"
